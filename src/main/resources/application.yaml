spring:
  application:
    name: ecom-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
