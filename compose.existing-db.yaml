services:
  backend:
    container_name: ecom-backend-api
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded random key}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "${APP_PORT:-8081}:8080"
    networks:
      - existing-database

networks:
  existing-database:
    external: true
    name: ${DB_DOCKER_NETWORK:-graphql-slardar_default}
